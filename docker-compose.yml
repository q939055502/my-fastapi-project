version: '3.8'

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: >
      sh -c "
      if [ \"$$APP_ENV\" = \"development\" ];
      then
        uvicorn src:app --host 0.0.0.0 --port 8000 --reload;
      else
        uvicorn src:app --host 0.0.0.0 --port 8000;
      fi
      "
    # 🔥 开发环境才挂载，生产环境不要加！
    volumes:
      - .:/app