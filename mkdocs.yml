site_name: My FastAPI Project
site_description: 企业级FastAPI后端项目
site_author: A
site_url: https://q939055502.github.io/my-fastapi-project/
# copyright: Copyright &copy; 2024 A | Based on <a href="https://github.com/JiayuXu0/FastAPI-Template">FastAPI-Template</a> by <a href="https://github.com/JiayuXu0">@JiayuXu0</a>

# Repository
repo_name: q939055502/my-fastapi-project
repo_url: https://github.com/q939055502/my-fastapi-project
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  language: zh
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至夜间模式
    # Dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/api
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - redirects:
      redirect_maps:
        'old-guide.md': 'guide/index.md'
  - swagger-ui-tag
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: true
            members_order: source
            group_by_category: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            docstring_section_style: table
            filters:
              - "!^_"
              - "!^__"

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: 目录
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: JiayuXu0
      repo: FastAPI-Template
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - 首页: index.md
  - 快速开始: guide/index.md
  - 架构设计: architecture/index.md
  - API 文档:
    - api/index.md
    - 公开接口: api/public.md
    - 认证授权: api/auth.md
    - 管理员接口:
      - 租户管理: api/admin_tenants.md
      - 套餐管理: api/admin_plans.md
      - 审计日志: api/admin_auditlog.md
      - 系统设置: api/admin_settings.md
    - 用户管理: api/users.md
    - 角色/职位管理: api/roles.md
    - 部门管理: api/depts.md
    - 资源管理: api/resources.md
    - 租户管理: api/tenant.md
    - 个人中心: api/me.md
    - 通用接口: api/common.md
    - 租户关联: api/tenants.md
  - 更新日志: changelog.md
  - 常见问题: faq.md

# Extra
extra:
  social:
    - icon: fontawesome/solid/globe
      link: http://fastapi.infyai.cn/

# JavaScript (for MathJax support)
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Validation
strict: false
