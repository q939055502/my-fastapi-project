# 200 开头 - 成功（HTTP 200/201）
20000: "操作成功"
20001: "创建成功"
20002: "更新成功"
20003: "删除成功"
20004: "导入成功"
20005: "导出成功"
20007: "需进一步操作"

# 204 开头 - 无内容成功（HTTP 204）
20400: "操作无内容"

# 400 开头 - 请求格式错误（HTTP 400）
40000: "请求格式错误"

# 401 开头 - 未授权（HTTP 401）
40100: "未登录或登录已过期"
40101: "Token格式非法"
40102: "Token已过期"
40103: "Token已被注销"
40104: "账号或密码错误"

# 403 开头 - 无权限（HTTP 403）
40300: "无访问权限"
40301: "账号已被禁用"
40302: "租户套餐已过期"
40303: "接口访问权限未开通"

# 404 开头 - 不存在（HTTP 404）
40400: "接口地址不存在"
40401: "业务实体不存在"

# 409 开头 - 冲突（HTTP 409）
40900: "数据已存在"
40901: "资源状态冲突"
40902: "业务条件不满足"

# 422 开头 - 参数校验失败（HTTP 422）
42200: "请求参数校验失败"
42201: "字段必填校验失败"
42202: "字段类型校验失败"
42203: "字段格式校验失败"
42204: "参数值超出范围"
42205: "参数值不满足约束"

# 429 开头 - 限流（HTTP 429）
42900: "接口访问频率超限"
42901: "单账号请求次数超限"

# 500 开头 - 服务器错误（HTTP 500）
50000: "服务器异常，请稍后重试"
50001: "数据库操作异常"
50002: "第三方接口调用失败"
50003: "缓存操作异常"
